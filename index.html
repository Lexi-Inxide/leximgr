<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lexifer | Enter</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Space Grotesk', sans-serif;
            background: #000;
        }

        /* =========================
           VIDEO BACKGROUND
        ========================= */

        .intro {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .intro video {
            position: absolute;
            top: 50%;
            left: 50%;

            width: 100%;
            height: 100%;

            transform: translate(-50%, -50%);

            object-fit: cover;
            z-index: 1;
        }

        /* =========================
           DARK OVERLAY
        ========================= */

        .overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.35),
                    rgba(0,0,0,0.55),
                    rgba(0,0,0,0.85)
                );

            z-index: 2;
        }

        /* =========================
           SOUND BUTTON
        ========================= */

        .sound-btn {
            position: fixed;

            top: 25px;
            right: 30px;

            width: 52px;
            height: 52px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.3);

            background: rgba(0,0,0,0.35);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;

            cursor: pointer;

            z-index: 10;

            box-shadow:
                0 0 20px rgba(255,0,0,0.2);

            transition: 0.3s ease;
        }

        .sound-btn:hover {
            transform: scale(1.1);

            border-color: rgba(255,60,60,0.8);

            background: rgba(255,40,40,0.15);

            box-shadow:
                0 0 20px rgba(255,40,40,0.4),
                0 0 40px rgba(255,0,0,0.2);
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            z-index: 3;

            padding: 20px;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            font-family: 'Great Vibes', cursive;

            font-size: clamp(70px, 12vw, 150px);

            color: white;

            text-shadow:
                0 0 10px rgba(255,255,255,0.5),
                0 0 30px rgba(255,50,50,0.6),
                0 0 70px rgba(255,0,0,0.4);

            animation: logoIn 1.8s ease forwards;
        }

        /* =========================
           SUBTITLE
        ========================= */

        .subtitle {
            margin-top: -15px;

            color: rgba(255,255,255,0.8);

            font-size: 14px;

            letter-spacing: 6px;

            text-transform: uppercase;

            animation: fadeIn 2s ease forwards;
        }

        /* =========================
           CONTINUE BUTTON
        ========================= */

        .continue-btn {
            margin-top: 45px;

            padding: 16px 40px;

            border-radius: 50px;

            border: 1px solid rgba(255,255,255,0.35);

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            color: white;

            font-family: 'Space Grotesk', sans-serif;

            font-size: 14px;

            font-weight: 600;

            letter-spacing: 2px;

            text-decoration: none;

            cursor: pointer;

            box-shadow:
                0 0 20px rgba(255,0,0,0.2);

            transition: 0.4s ease;

            animation: buttonIn 2.5s ease forwards;
        }

        .continue-btn:hover {

            background: rgba(255,40,40,0.2);

            border-color: rgba(255,60,60,0.8);

            transform: translateY(-5px) scale(1.04);

            box-shadow:
                0 0 20px rgba(255,40,40,0.4),
                0 0 50px rgba(255,0,0,0.25);
        }

        /* =========================
   EXIT / PAGE TRANSITION
========================= */

.intro.exit {
    animation: introExit 1.2s ease forwards;
}

.intro.exit .content {
    animation: contentExit 1s ease forwards;
}

.intro.exit video {
    animation: videoZoomOut 1.2s ease forwards;
}

.intro.exit .overlay {
    animation: overlayExit 1.2s ease forwards;
}

.continue-btn.loading {
    pointer-events: none;
    transform: scale(1.08);
    background: rgba(255, 40, 40, 0.25);
    border-color: rgba(255, 80, 80, 0.9);

    box-shadow:
        0 0 25px rgba(255, 40, 40, 0.7),
        0 0 60px rgba(255, 0, 0, 0.5),
        0 0 100px rgba(255, 0, 0, 0.25);
}

.continue-btn.loading::after {
    content: "";
    position: absolute;

    width: 100%;
    height: 100%;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50px;

    border: 2px solid rgba(255,255,255,0.7);

    animation: buttonPulse 0.8s ease-out infinite;
}


/* =========================
   EXIT ANIMATIONS
========================= */

@keyframes introExit {

    0% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        visibility: hidden;
    }

}

@keyframes contentExit {

    0% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }

    100% {
        opacity: 0;
        transform: scale(1.15);
        filter: blur(12px);
    }

}

@keyframes videoZoomOut {

    0% {
        transform: translate(-50%, -50%) scale(1);
    }

    100% {
        transform: translate(-50%, -50%) scale(1.15);
    }

}

@keyframes overlayExit {

    0% {
        opacity: 1;
    }

    100% {
        opacity: 0.15;
    }

}

@keyframes buttonPulse {

    0% {
        width: 100%;
        height: 100%;
        opacity: 0.8;
    }

    100% {
        width: 150%;
        height: 180%;
        opacity: 0;
    }

}

        /* =========================
           BOTTOM TEXT
        ========================= */

        .bottom-text {

            position: absolute;

            bottom: 25px;

            color: rgba(255,255,255,0.45);

            font-size: 11px;

            letter-spacing: 3px;

            text-transform: uppercase;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes logoIn {

            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
                filter: blur(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes buttonIn {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media(max-width:600px) {

            .subtitle {
                font-size: 10px;
                letter-spacing: 4px;
            }

            .continue-btn {
                padding: 14px 28px;
                font-size: 12px;
            }

            .sound-btn {
                width: 45px;
                height: 45px;

                top: 18px;
                right: 18px;

                font-size: 17px;
            }

        }

    </style>
</head>

<body>

    <div class="intro">

        <!-- =========================
             YOUR ANIME EDIT
        ========================= -->

        <video
            id="introVideo"
            autoplay
            muted
            loop
            playsinline
        >
            <source src="intro.mp4" type="video/mp4">
        </video>


        <!-- DARK OVERLAY -->
        <div class="overlay"></div>


        <!-- =========================
             SOUND ON/OFF BUTTON
        ========================= -->

        <button
            id="soundBtn"
            class="sound-btn"
            aria-label="Turn sound on"
            title="Turn sound on"
        >
            🔇
        </button>


        <!-- =========================
             CONTENT
        ========================= -->

        <div class="content">

            <div class="logo">
                Lexifer
            </div>

            <div class="subtitle">
                Welcome to my world
            </div>

            <a
                href="lexifer.html"
                class="continue-btn"
            >
                CONTINUE TO LEXIFER WEB
            </a>

            <div class="bottom-text">
                © 2026 Lexifer
            </div>

        </div>

    </div>


    <!-- =========================
         SOUND CONTROL JAVASCRIPT
    ========================= -->

    <script>

const continueBtn = document.querySelector(".continue-btn");
const intro = document.querySelector(".intro");


/* =========================
   CINEMATIC CONTINUE EFFECT
========================= */

continueBtn.addEventListener("click", function(event) {

    event.preventDefault();

    /* Prevent double clicking */
    if (continueBtn.classList.contains("loading")) {
        return;
    }

    /* Activate button animation */
    continueBtn.classList.add("loading");

    /* Small delay before screen transition */
    setTimeout(() => {

        /* Start cinematic exit */
        intro.classList.add("exit");

    }, 250);


    /* Open main website after animation */
    setTimeout(() => {

        window.location.href = "lexifer.html";

    }, 1200);

});

        const video = document.getElementById("introVideo");
        const soundBtn = document.getElementById("soundBtn");

        soundBtn.addEventListener("click", function () {

            if (video.muted) {

                /* TURN SOUND ON */
                video.muted = false;
                video.volume = 1;

                soundBtn.innerHTML = "🔊";
                soundBtn.setAttribute("aria-label", "Turn sound off");
                soundBtn.setAttribute("title", "Turn sound off");

            } else {

                /* TURN SOUND OFF */
                video.muted = true;

                soundBtn.innerHTML = "🔇";
                soundBtn.setAttribute("aria-label", "Turn sound on");
                soundBtn.setAttribute("title", "Turn sound on");

            }

        });

    </script>

</body>
</html>
